name: Import verified Open Policy Agent source onto main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-opa-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opa-reference-source-import
  cancel-in-progress: false

jobs:
  source-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Fetch and verify pinned OPA source directly on main
        shell: bash
        env:
          PINNED_SHA: '8d10da6e34b846269f990daa43f39003e79b9dc4'
          PINNED_TREE: '0d0c805a243292f6d2a57a9cf6bf5688b8dd7483'
        run: |
          set -euo pipefail
          git config user.name 'TrillionAI Source Archive Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add source-upstream https://github.com/open-policy-agent/opa.git
          git fetch --no-tags --depth=1 source-upstream "$PINNED_SHA"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$PINNED_SHA" || {
            echo "::error::Original upstream commit does not match pinned SHA"
            exit 1
          }
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$PINNED_TREE" || {
            echo "::error::Original upstream source tree does not match"
            exit 1
          }
          git cat-file -e "$PINNED_SHA:LICENSE"
          research_blob="$(git rev-parse 'HEAD:README.md')"
          git read-tree --reset "$PINNED_TREE"
          git update-index --add --cacheinfo "100644,$research_blob,TRILLIONAI_REFERENCE.md"

          # Import source but do not activate upstream CI workflows.
          git ls-files -z '.github/workflows/' | xargs -0 -r git rm -r --cached --

          git ls-tree -rz --full-tree "$PINNED_TREE" > /tmp/opa-original-tree
          git ls-files --stage -z > /tmp/opa-import-index
          python3 - <<'PY'
          from pathlib import Path

          def parse(data, index):
              result = {}
              for row in data.split(b'\0'):
                  if not row:
                      continue
                  metadata, path = row.split(b'\t', 1)
                  fields = metadata.split()
                  result[path] = (fields[0], fields[1 if index else 2])
              return result

          source = parse(Path('/tmp/opa-original-tree').read_bytes(), False)
          imported = parse(Path('/tmp/opa-import-index').read_bytes(), True)
          unexpected = set(imported) - set(source)
          missing_or_changed = [
              p for p, identity in source.items()
              if not p.startswith(b'.github/workflows/')
              and imported.get(p) != identity
          ]
          if missing_or_changed or unexpected != {b'TRILLIONAI_REFERENCE.md'}:
              raise SystemExit(
                  f'OPA import verification failed: {missing_or_changed[:5]!r}; extras {unexpected!r}'
              )
          print(f'VERIFIED {len(source)} original tracked file object identities')
          PY

          git commit -m "archive: import pinned OPA source directly onto main"
          # Never bypass GitHub's secret-scanning push protection.
          git push origin HEAD:main
          git fetch --no-tags origin main
          local_tree="$(git rev-parse 'HEAD^{tree}')"
          remote_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test "$local_tree" = "$remote_tree" || {
            echo "::error::Remote main tree differs from verified imported tree"
            exit 1
          }
          echo "VERIFIED PINNED COMMIT: $PINNED_SHA"
          echo "VERIFIED ORIGINAL GIT TREE: $PINNED_TREE"
          echo "VERIFIED REMOTE MAIN GIT TREE: $remote_tree"
          echo "REAL OPA SOURCE ON MAIN; ORIGINAL LICENSE RETAINED"
